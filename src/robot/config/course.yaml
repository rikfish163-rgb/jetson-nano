# Offline metric course model used by tools/competition_sim.py.
#
# Values under `measured` are taken from the supplied metric map, the 2025
# rules, or the user's confirmed dimensions.  Route event order and placement
# under `routes` are an interpretation of the red dotted paths in the three
# supplied screenshots; they are intentionally labelled `inferred`.
schema: competition-course-v1
provenance:
  measured:
    arena_width_m: 6.0                 # metric map: 6000 mm
    arena_height_m: 6.0                # metric map: 6000 mm
    lane_width_m: 0.60                 # metric map / user confirmation
    turn_radii_m: [0.60, 1.20, 1.80]   # metric map labels R600/R1200/R1800
    slots:
      P1: {kind: parallel, length_m: 0.70, width_m: 0.36}
      P2: {kind: parallel, length_m: 0.70, width_m: 0.36}
      P3: {kind: parallel, length_m: 0.70, width_m: 0.36}
      P4: {kind: perpendicular, length_m: 0.45, width_m: 0.38}
      P5: {kind: perpendicular, length_m: 0.45, width_m: 0.38}
    # Fixed arena solids from the metric map. Route-specific bay placement
    # remains under inferred below because it is read from the screenshots.
    road_geometry:
      outer_corner_radius_m: 1.80
      top_pill_centres_m: [[-1.20, 1.20], [1.20, 1.20]]
      bottom_island_centres_m: [[-1.20, -1.20], [1.20, -1.20]]
  configured_model:
    wheelbase_m: 0.26                  # current competition.yaml
    body_width_m: 0.24                 # current competition.yaml
    front_overhang_m: 0.07             # current competition.yaml
    rear_overhang_m: 0.07              # current competition.yaml
    raw_forward_mps: 0.16              # raw 20 * configured 0.008 mapping
    max_steer_rad: 0.46275             # current competition.yaml
  inferred:
    coordinate_frame: "arena origin at centre; +x east, +y north; yaw CCW"
    route_sources:
      - /tmp/codex-clipboard-14c82eea-c990-4c56-823d-5d9a31f995b0.png#left
      - /tmp/codex-clipboard-14c82eea-c990-4c56-823d-5d9a31f995b0.png#right
      - /tmp/codex-clipboard-44c35319-efe3-477a-be84-efd58b697eca.png
    note: "Screenshot red paths and sign identities are inferred; do not treat them as surveyed coordinates."
    road_geometry:
      # These openings and bay poses are screenshot-derived placement only;
      # slot dimensions and the fixed arena solids above stay measured.
      central_openings:
        - {xmin: -0.45, xmax: 0.45, ymin: 0.55, ymax: 1.85}
      parking_slot_poses:
        P1: [0.70, 1.62, 0.0]
        P2: [0.00, 1.62, 0.0]
        P3: [-0.70, 1.62, 0.0]
        P4: [0.20, 0.83, 1.5707963267948966]
        P5: [-0.20, 0.83, 1.5707963267948966]
      parking_bay_regions:
        P1: {xmin: 0.35, xmax: 1.05, ymin: 1.44, ymax: 1.80}
        P2: {xmin: -0.35, xmax: 0.35, ymin: 1.44, ymax: 1.80}
        P3: {xmin: -1.05, xmax: -0.35, ymin: 1.44, ymax: 1.80}
        P4: {xmin: 0.01, xmax: 0.39, ymin: 0.605, ymax: 1.055}
        P5: {xmin: -0.39, xmax: -0.01, ymin: 0.605, ymax: 1.055}
    obstacle_note: "No obstacle placement is asserted from screenshots; optional route obstacles are ray-cast when supplied."

