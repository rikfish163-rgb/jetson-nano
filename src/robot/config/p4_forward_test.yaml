# 独立 P4 正入库测试参数；不影响整车 vehicle_tuning.yaml。
# 速度、转角为底盘 raw 单位；转角 + 向左，- 向右。
countdown_s: 3.0
prepare_speed_raw: 30
prepare_steering_raw: 0
prepare_s: 2.0
align_speed_raw: 15
# 两条边线引导阶段的最长前进时间；还没确认底线时超时停车。
side_align_timeout_s: 15.0
# 底线连续出现的不同图像帧数，满足后才切换到底线纠偏。
bottom_seen_frames: 3
align_timeout_s: 25.0
final_speed_raw: 30
final_s: 1.0
search_timeout_s: 10.0
seen_frames: 3
lost_frames: 3
lost_s: 0.2
verify_timeout_s: 1.0
camera_timeout_s: 0.5
control_gap_s: 0.25
steering_limit_raw: 22
# 边线引导：只用前方 lookahead_m 处的中心线位置和方向。
# 底线确认后：中心线位置与库底中点按 bottom_weight 混合纠偏。
lookahead_m: 0.30
position_gain: 32.0
heading_gain: 15.0
bottom_weight: 0.3
# 库底中点在去畸变前摄画面中的纵坐标/图像高度，需接近下沿。
bottom_near_row: 0.86
near_frames: 2
near_motion_pixels: 2.0
near_recent_s: 0.5
# P4 实际宽度来自当前车位配置：0.38m。
bay_width_m: 0.38
width_tolerance_m: 0.08
max_heading_deg: 35.0
parallel_tolerance_deg: 8.0
min_side_m: 0.12
# 已确认库位接近画面下沿时，允许跟踪短侧线；初次确认仍需 0.12m。
tracking_min_side_m: 0.025
min_bottom_m: 0.20
paint_support: 0.75
white_v_min: 190
white_s_max: 75
# 不允许纠偏途中突然换到旁边库位。
target_jump_m: 0.12
target_heading_jump_deg: 12.0
