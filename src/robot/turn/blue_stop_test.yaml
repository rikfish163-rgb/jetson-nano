# 共用蓝线接近参数：独立测试与正式 LEFT/RIGHT/STRAIGHT/UTURN 同时使用；PARKING除外。
# 俯视图 /competition/debug/front_bev 高度百分比：顶部0，底部1。
align_speed_raw: 30       # 对齐速度；整车确认方向牌后，循迹接近速度也不超过此值
align_max_steering_raw: 10 # 对齐时最大舵机修正量，范围1～22
align_tolerance_deg: 10    # 远处对齐目标，允许1～15度，且不能大于heading_tolerance_deg
align_confirm_frames: 3  # 对齐完成需要的连续新图像帧数
align_timeout_s: 8.0     # 看见蓝线后，对齐未完成的最长时间
align_recheck_s: 1.0     # 触发区角度超限时，先停车等待新图像复核；0表示立即报错
speed_raw: 20             # 对齐后接近及触发后直行速度；计时阶段转向0
trigger_row_ratio: 0.7    # 蓝线与画面中心竖线交点到达此高度后开始确认
trigger_band_ratio: 0.20   # 确认范围为trigger_row_ratio～两者之和，目前0.70～0.90
confirm_frames: 3         # 只计不同摄像头帧
heading_tolerance_deg: 15 # 触发区允许角度（1～30度）；仍须连续确认，超过则停车复核
forward_seconds: 1      # 已调试值：触发确认后继续前进时间
max_search_seconds: 15.0  # 未找到触发位置时最多直行多久
camera_timeout_s: 0.6    # 图像断流则停车；雷达断流也停车
