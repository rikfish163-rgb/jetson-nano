# 避障：只在此文件写本模块需要覆盖的参数。
# 用 python2 tools/module_workspace.py check 检查参数归属。
# 距离参考后轴。车头前伸 0.33 m；0.50 m 触发时转弯空间不足。
# 0.85 m 约为车头前方 0.52 m，仍由原有碰撞检查决定是否允许运动。
timed_bypass_trigger_distance_m: 0.85
# 停车下发左满舵后等待；这是待标定的换向余量，不是实际轮角反馈。
timed_bypass_settle_s: 0.4
# RAW 20 下的初始左打时长：26 * 2 / 20 = 2.6 s；仅按指令量估计，需实车复核。
timed_bypass_left_s: 2.6
# 与左打同倍率延长：6 * (2.6 / 2) = 7.8 s。
timed_bypass_right_s: 7.8
